name: ⚡ Cloud Functions Deploy

on:
  push:
    branches: [main]
    paths: ['backend/**', 'firestore/**', 'storage.rules']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  test-and-deploy:
    name: Test & Deploy Functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install dependencies
        working-directory: backend/functions
        run: npm ci

      - name: TypeScript type check
        working-directory: backend/functions
        run: npx tsc --noEmit

      - name: Lint
        working-directory: backend/functions
        run: npm run lint

      - name: Build
        working-directory: backend/functions
        run: npm run build

      - name: Run tests
        working-directory: backend/functions
        run: npm test

      - name: Deploy Functions, Rules & Indexes
        if: github.ref == 'refs/heads/main'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore:rules,firestore:indexes,storage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
