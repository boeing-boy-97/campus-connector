name: campus_connect
description: Campus Connect — College-verified student networking & dating app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0
  firebase_app_check: ^0.3.1
  cloud_functions: ^5.0.0

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.2.0

  # UI Components
  flutter_card_swiper: ^7.0.0  # Tinder-style swipe cards
  cached_network_image: ^3.3.0
  image_picker: ^1.1.0
  image_cropper: ^7.1.0
  photo_view: ^0.15.0
  lottie: ^3.1.0  # Animations
  shimmer: ^3.0.0  # Loading skeletons
  smooth_page_indicator: ^1.1.0

  # Chat
  flutter_chat_ui: ^1.6.0

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^17.2.0
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.0

  # Security / Validation
  email_validator: ^2.1.0

  # HTTP
  dio: ^5.5.0

  # Icons
  flutter_svg: ^2.0.0
  hugeicons: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
