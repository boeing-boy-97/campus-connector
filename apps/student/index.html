<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#244c43" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Campus Connector — a private, verified community for college students to find collaborators, friends, and meaningful campus connections." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Campus Connect" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Campus Connector</title>
    <style>
      /* Critical CSS — prevents FOUC on auth page */
      body { margin: 0; background: #f6f5f0; }
      .splash { min-height: 100vh; display: grid; place-items: center; background: #244c43; }
      .splash-mark { width: 48px; height: 48px; border-radius: 14px; background: #d8ee6c; display: grid; place-items: center; font: bold 29px Georgia, serif; color: #244c43; animation: pulse 1.5s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Critical loading state — shown until React hydrates -->
      <div class="splash">
        <div class="splash-mark">C</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
