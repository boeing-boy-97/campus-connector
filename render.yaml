services:
  - type: web
    name: campus-connect-backend
    env: node
    rootDir: backend/functions
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://campus-connector-student.vercel.app
      - key: NODE_ENV
        value: production
